<style>
body {
font-family: 'Zen Maru Gothic', 'Plus Jakarta Sans', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif;

/* 押しやすいボタンサイズ（スマホ向け） */

<script>
'use strict';


// ============================================================
// 🔑 Gemini API の設定（ここだけ編集してください）
// ============================================================
// ・下の '' の中に、Google AI Studio で「新しく発行した」APIキーを貼り付けます。
// 例） const GEMINI_API_KEY = 'あなたの新しいキー';
// ・以前このファイルに書かれていた（漏えいした）キーは絶対に使わないでください。
// ・空のままでもアプリは動きます（AIの代わりに定型文の助言でカードを作成）。
// ・このファイルは自分のPC内だけで使い、キーを入れたまま他人に渡したり、
// インターネットに公開したり、GitHub に上げたりしないでください。
const GEMINI_API_KEY = '';
const GEMINI_MODEL = 'gemini-3.8-flash';
// ============================================================


const GEMINI_ENDPOINT = 'https://generativelanguage.googleapis.com/v1beta/models/';
const ADVICE_TIMEOUT_MS = 15000; // AIの応答待ち上限（ミリ秒）
const GEMINI_MAX_OUTPUT_TOKENS = 1024; // 出力トークン上限（思考トークンも含むため余裕を持たせる）
const MAXLEN_SHORT = 100; // 1行入力の上限文字数
const MAXLEN_LONG = 300; // メッセージ欄の上限文字数


// 選択肢（AIに送ってよいのはこの一覧に含まれる値だけ）
const SYMPTOM_OPTIONS = ['頭痛・めまい', '腹痛・胃痛', '発熱・寒気・のど痛', '鼻水・鼻づまり・くしゃみ', '吐き気・下痢', '生理痛', 'かゆみ・湿疹・虫刺され', '擦り傷・切り傷', '打撲・捻挫・痛む箇所', 'やけど（火傷）'];
const ONSET_OPTIONS = ['今日・さっきから', '昨日の夜から', '数日前から続いている', '1週間以上前からずっと'];


// 緊急性の高い言葉（自由記入欄のチェック用）
const CRISIS_PATTERN = /(死にたい|しにたい|シニタイ|死んでしまいたい|しんでしまいたい|死のう|消えたい|きえたい|消えてしまいたい|きえてしまいたい|自殺|自傷|リスカ|リストカット|自分を傷つけ|首を吊|首をつ|飛び降り|とびおり|生きていたくない|生きるのがつらい|いなくなりたい|オーバードーズ|過量服薬|薬をたくさん飲)/i;
const PHYSICAL_EMERGENCY_PATTERN = /(息ができな|呼吸ができな|呼吸が苦し|息が苦し|意識がな|意識が遠|意識がもうろう|反応がな|けいれん|痙攣|血が止まらな|大量に出血|大量の出血|胸が締め付け|激しい胸の痛み|胸が激しく痛|アナフィラキシー|唇が腫れ|顔が腫れ|ろれつが回らな|顔の片側|手足が動かな)/;


// ============================================================
// グローバル状態管理
// ============================================================
const DEFAULT_STATE = Object.freeze({
mode: 'physical', // 'physical' or 'mental'
birthdate: '',
calculatedAge: '',
ageGroup: '',
height: '',
weight: '',
pregnancy: 'いいえ',
redFlags: [],
symptom: '',
symptomChips: [],
onset: '',
severity: '5',
impact: '',
impactChips: [],
feelingChips: [],
currentMeds: '',
allergies: '',
history: '',
doping: '',
expectations: '',
finalNotes: '',
destination: '',
isEmergency: false,
geminiAdvice: '',
adviceSource: ''
});


const state = {};
let currentStep = 0;
let conversationHistory = [];
let inputMemory = {}; // 「戻る」で入力欄を復元するための記録（状態の巻き戻し対象外）
let isBusy = false; // カード作成中（非同期処理中）
let isExporting = false; // PNG/PDF 保存中
let flowToken = 0; // やり直し・戻る操作で古い非同期処理の結果を無視するための番号
let currentAbort = null; // 進行中の API 通信
let suppressBotMessages = false;
const adviceCache = new Map(); // 同じ内容でAPIを再呼び出ししないためのキャッシュ


const chatContainer = document.getElementById('chat-container');
const inputContainer = document.getElementById('input-container');
const stepIndicator = document.getElementById('step-indicator');
const backBtn = document.getElementById('back-btn');


function resetState() {
const fresh = JSON.parse(JSON.stringify(DEFAULT_STATE));
Object.keys(state).forEach(k => delete state[k]);
Object.assign(state, fresh);
}
resetState();


// ============================================================
// 汎用ユーティリティ
// ============================================================
function esc(value) {
return String(value ?? '').replace(/[&<>"']/g, c => ({
'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[c]));
}


// **太字** だけを許可した安全なメッセージ整形（それ以外のHTMLはすべて無効化）
function formatMessage(text) {
return esc(text).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}


function clip(value, max) {
return String(value ?? '').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, '').trim().slice(0, max);
}


function isNone(value) {
const v = String(value ?? '').trim();
return v === '' || /^(なし|無し|ない|特になし|とくになし|特に無し|no|none)$/i.test(v);
}


function isMentalMode() {
return state.mode === 'mental';
}


// 入力欄を描画し、以前の入力内容があれば復元する
function setControls(html) {
inputContainer.innerHTML = html;
applyInputMemory();
inputContainer.scrollTop = 0;
}


function rememberInputs() {
if (!inputContainer) return;
const groups = {};
inputContainer.querySelectorAll('input, select, textarea').forEach(el => {
if (el.type === 'checkbox' && el.name) {
groups[el.name] = groups[el.name] || [];
if (el.checked) groups[el.name].push(el.value);
} else if (el.id) {
inputMemory[el.id] = el.value;
}
});
Object.keys(groups).forEach(name => { inputMemory['cb:' + name] = groups[name]; });
}


function applyInputMemory() {
inputContainer.querySelectorAll('input, select, textarea').forEach(el => {
if (el.type === 'checkbox' && el.name) {
const saved = inputMemory['cb:' + el.name];
if (Array.isArray(saved)) el.checked = saved.includes(el.value);
} else if (el.id && Object.prototype.hasOwnProperty.call(inputMemory, el.id)) {
const saved = inputMemory[el.id];
if (el.tagName === 'SELECT' && ![...el.options].some(o => o.value === saved)) return;
el.value = saved;
if (el.type === 'range') el.dispatchEvent(new Event('input'));
}
});
}


function showInlineError(message) {
let box = document.getElementById('inline-error');
if (!box) {
box = document.createElement('div');
box.id = 'inline-error';
box.setAttribute('role', 'alert');
box.className = 'mb-2 bg-rose-50 border border-rose-300 text-rose-800 text-[11px] font-bold rounded-xl px-2.5 py-1.5';
inputContainer.prepend(box);
}
box.textContent = '⚠️ ' + message;
inputContainer.scrollTop = 0;
}


// テキスト欄で Enter を押したら、その画面の決定ボタンを押す（日本語の変換確定中は無視）
inputContainer.addEventListener('keydown', e => {
if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
const t = e.target;
if (!(t instanceof HTMLInputElement) || !['text', 'number', 'date'].includes(t.type)) return;
const btn = inputContainer.querySelector('[data-primary]');
if (btn && !btn.disabled) { e.preventDefault(); btn.click(); }
});


// 入力し直したらエラー表示を消す
inputContainer.addEventListener('input', () => {
const box = document.getElementById('inline-error');
if (box) box.remove();
});


// 入力途中でページを閉じそうになったら確認する（保存後・緊急画面では出さない）
let hasExported = false;
window.addEventListener('beforeunload', e => {
if (currentStep > 0 && !state.isEmergency && !hasExported) {
e.preventDefault();
e.returnValue = '';
}
});


function setBusy(busy) {
isBusy = busy;
if (backBtn) backBtn.disabled = busy;
}


// ============================================================
// 起動・モード切替
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
startInitialFlow();
});


// keepMemory: 「戻る」で最初の画面へ戻ったときは入力内容の記録を残す
function startInitialFlow(keepMemory = false) {
flowToken++;
if (currentAbort) { try { currentAbort.abort(); } catch (e) { /* noop */ } currentAbort = null; }
setBusy(false);
isExporting = false;
hasExported = false;
currentStep = 0;
conversationHistory = [];
if (!keepMemory) inputMemory = {};
resetState();
setThemeStyle('physical');
if (chatContainer) chatContainer.innerHTML = '';
const printRoot = document.getElementById('print-root');
if (printRoot) printRoot.innerHTML = '';
addBotMessage("こんにちは。KOTOHANAへようこそ。ここは完全匿名で利用できる安心な場所です。\n\nまず最初に、**どのようなご相談**ですか？", true);
updateStepIndicator("相談カテゴリーの選択");


if (inputContainer) {
setControls(`
<div class="space-y-2">
<button type="button" onclick="selectMode('physical')" class="w-full py-3 px-3.5 bg-gradient-to-r from-teal-50 to-emerald-50 hover:from-teal-100 hover:to-emerald-100 text-teal-900 border border-teal-200 rounded-2xl font-bold text-xs sm:text-sm text-left flex items-center justify-between gap-2 shadow-sm active:scale-98 cursor-pointer">
<div class="flex items-center gap-2 min-w-0">
<span class="text-lg">🩺</span>
<div class="min-w-0">
<div>体の不調・けが・痛みの相談</div>
<div class="text-[10px] text-teal-700 font-normal">頭痛、腹痛、ねんざ、創傷、風邪症状など</div>
</div>
</div>
<span class="text-teal-600">→</span>
</button>
<button type="button" onclick="selectMode('mental')" class="w-full py-3 px-3.5 bg-gradient-to-r from-purple-50 via-fuchsia-50 to-rose-50 hover:from-purple-100 hover:to-fuchsia-100 text-purple-950 border border-purple-200 rounded-2xl font-bold text-xs sm:text-sm text-left flex items-center justify-between gap-2 shadow-sm active:scale-98 cursor-pointer">
<div class="flex items-center gap-2 min-w-0">
<span class="text-lg">🌙</span>
<div class="min-w-0">
<div>心の相談・気分の不調（専用モード）</div>
<div class="text-[10px] text-purple-700 font-normal">気持ちの整理・不安・疲れ・学校生活の悩み</div>
</div>
</div>
<span class="text-purple-600">→</span>
</button>
</div>
`);
}
}


function updateStepIndicator(text) {
if (stepIndicator) stepIndicator.innerText = text;
const bar = document.getElementById('progress-bar');
if (bar) {
const total = isMentalMode() ? 7 : 11;
const pct = currentStep <= 0 ? 0 : Math.min(100, Math.round((currentStep - 1) / total * 100));
bar.style.width = (document.getElementById('pdf-card') || currentStep > total ? 100 : pct) + '%';
bar.className = 'h-full transition-all duration-500 ' + (state.isEmergency ? 'bg-rose-600' : isMentalMode() ? 'bg-purple-600' : 'bg-teal-600');
}
if (backBtn) {
if (currentStep > 0) backBtn.classList.remove('hidden');
else backBtn.classList.add('hidden');
backBtn.classList.toggle('text-teal-800', !isMentalMode());
backBtn.classList.toggle('text-purple-800', isMentalMode());
}
}


function stepLabel(text) {
const total = isMentalMode() ? 7 : 11;
if (currentStep < 1 || currentStep > total) return text;
return `text（{currentStep}/${total}）`;
}


function setThemeStyle(mode) {
const header = document.getElementById('main-header');
const icon = document.getElementById('header-icon');
const subtitle = document.getElementById('header-subtitle');
const desc = document.getElementById('header-desc');


if (!header || !icon || !subtitle || !desc) return;


if (mode === 'mental') {
header.className = "bg-gradient-to-r from-purple-900 via-purple-800 to-rose-900 text-white p-3 sm:p-4 shadow-md flex-shrink-0 relative transition-all duration-300";
icon.innerText = "🌙";
subtitle.innerText = "心の相談モード";
subtitle.className = "text-[10px] sm:text-xs text-purple-200 font-medium whitespace-nowrap";
desc.innerText = "不安・悲しみ・言葉にしにくい気持ちを静かに整理します";
} else {
header.className = "bg-gradient-to-r from-teal-700 via-teal-600 to-emerald-600 text-white p-3 sm:p-4 shadow-md flex-shrink-0 relative transition-all duration-300";
icon.innerText = "🌱";
subtitle.innerText = "心と体の相談メモ";
subtitle.className = "text-[10px] sm:text-xs text-teal-100 font-medium whitespace-nowrap";
desc.innerText = "伝えにくい不調やけが、悩みをカードに整理して周囲や専門家へ共有できます";
}
}


function selectMode(mode) {
if (isBusy || currentStep !== 0) return; // 二重タップ防止
if (mode !== 'physical' && mode !== 'mental') return;
if (inputMemory.__mode && inputMemory.__mode !== mode) inputMemory = {};
saveStepState();
state.mode = mode;
inputMemory.__mode = mode;
setThemeStyle(mode);
currentStep = 1;
if (mode === 'physical') {
addUserMessage("🩺 体の不調・けが・痛みの相談");
checkRedFlagsFirst();
} else {
addUserMessage("🌙 心の相談モードを選択しました");
askMentalQuestions();
}
}


// ============================================================
// 「1つ前に戻る」
// ============================================================
// 回答を確定する直前の状態（質問が表示された状態のチャット・回答前の state）を保存する
function saveStepState() {
rememberInputs();
conversationHistory.push({
step: currentStep,
state: JSON.parse(JSON.stringify(state)),
chatHtml: chatContainer ? chatContainer.innerHTML : ''
});
}


function goBackStep() {
if (isBusy || isExporting) return;
if (conversationHistory.length === 0) return;
flowToken++;
const prev = conversationHistory.pop();


if (prev.step === 0) {
startInitialFlow(true);
return;
}


currentStep = prev.step;
resetState();
Object.assign(state, prev.state);
if (chatContainer) {
chatContainer.innerHTML = prev.chatHtml;
chatContainer.scrollTop = chatContainer.scrollHeight;
}


// 質問文はチャット内に残っているので、入力欄だけを描き直す（質問の重複を防ぐ）
suppressBotMessages = true;
try {
renderCurrentStep();
} finally {
suppressBotMessages = false;
}
}


function renderCurrentStep() {
setThemeStyle(isMentalMode() ? 'mental' : 'physical');
if (isMentalMode()) {
askMentalQuestions();
} else if (currentStep === 1) {
checkRedFlagsFirst();
} else {
askPhysicalStep();
}
}

// 自由記入欄に緊急性の高い言葉が含まれていないか確認する。
// 含まれていれば通常の問診を中断し true を返す。
function guardFreeText(text) {
const value = String(text || '');
if (!value) return false;
if (CRISIS_PATTERN.test(value)) {
saveStepState();
addUserMessage(value);
showMentalCrisis();
return true;
}
if (!isMentalMode() && PHYSICAL_EMERGENCY_PATTERN.test(value)) {
saveStepState();
addUserMessage(value);
showPhysicalEmergency();
return true;
}
return false;
}

function todayISO() {
const d = new Date();
const pad = n => String(n).padStart(2, '0');
return `d.getFullYear()-{pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function submitBirthdate(isMental = false) {
if (isBusy) return;
const dateInput = document.getElementById('birthdateInput');
const ageInput = document.getElementById('ageInput');
const dateValue = dateInput ? dateInput.value : '';
const ageValue = ageInput ? ageInput.value.trim() : '';


let age = null;
let label = '';
let birthdate = '';
if (dateValue) {
age = calculateAge(dateValue);
if (age === null || age < 0 || age > 120) {
showInlineError('正しい生年月日を選択してください（未来の日付は選べません）。');
return;
}
birthdate = dateValue;
label = `dateValue（{age}歳）`;
} else if (ageValue !== '') {
const n = Number(ageValue);
if (!Number.isInteger(n) || n < 0 || n > 120) {
showInlineError('年齢は0〜120の整数で入力してください。');
return;
}
age = n;
label = `${age}歳`;
} else {
showInlineError('生年月日を選択するか、年齢を入力してください。');
return;
}


saveStepState();
state.birthdate = birthdate;
state.calculatedAge = age;
state.ageGroup = age < 15 ? `age歳(15歳未満)`:`{age}歳 (15歳以上)`;
addUserMessage(label);
currentStep++;
if (isMental) askMentalQuestions(); else askPhysicalStep();
}

// ============================================================
// 市販薬の安全チェック（AIを使わずルールのみで判定）
// ============================================================
function getDrugRecommendations(symptomText, age, historyText, dopingText, currentMeds, allergies, pregnancy) {
const symptom = String(symptomText || '');
const history = String(historyText || '');
const doping = String(dopingText || '');
const ageNum = Number.isInteger(Number(age)) && String(age) !== '' ? Number(age) : null;
const severity = parseInt(state.severity, 10) || 0;
const onset = String(state.onset || '');


const warnings = [];
const referral = [];


if (ageNum === null) {
warnings.push("⚠️ 年齢未確認：市販薬は年齢で使える製品が異なります。店頭で年齢をお伝えください");
} else if (ageNum < 15) {
if (ageNum < 3) warnings.push(`⚠️ ${ageNum}歳（乳幼児）：市販薬で様子を見るより、医師の診察を優先してください（特に1歳未満）`);
warnings.push(`⚠️ ${ageNum}歳（15歳未満）：市販のロキソプロフェン・イブプロフェン製剤の多くは15歳未満は使えません。アスピリン等のサリチル酸系解熱鎮痛薬は、15歳未満ではライ症候群との関連から避けるべきとされています。年齢に合う製品を薬剤師にご確認ください`);
}
if (pregnancy && (pregnancy.includes('あり') || pregnancy.includes('わからない'))) {
warnings.push("⚠️ 妊娠の可能性：解熱鎮痛薬（特にイブプロフェン・ロキソプロフェン等のNSAIDs）を含め、自己判断での服用は避け、必ず医師・薬剤師にご相談ください");
}
if (pregnancy === '授乳中') {
warnings.push("⚠️ 授乳中：成分によっては母乳に移行するものがあります。授乳中であることを薬剤師にお伝えください");
}
if (/喘息|ぜんそく/.test(history)) {
warnings.push("⚠️ 喘息の既往：解熱鎮痛薬で喘息発作（アスピリン喘息）が起こることがあります。必ず薬剤師にお伝えください");
}
if (/胃潰瘍|十二指腸潰瘍|潰瘍|胃炎/.test(history)) {
warnings.push("⚠️ 胃の病気の既往：NSAIDs（解熱鎮痛薬）は胃への負担があります。薬剤師にご相談ください");
}
if (/腎|肝|心臓|心不全|高血圧|糖尿病|緑内障|前立腺/.test(history)) {
warnings.push("⚠️ 持病あり：使えない市販薬がある可能性があります。持病名を薬剤師にお伝えください");
}
if (doping.includes('あり')) {
warnings.push("🏅 アンチ・ドーピング：総合感冒薬や一部の漢方薬・鼻炎薬（エフェドリン類・マオウ等）には禁止物質が含まれることがあります。スポーツファーマシスト等の薬剤師にご確認ください");
}
if (!isNone(currentMeds)) {
warnings.push(`💊 併用確認：現在服用中の「${currentMeds}」との重複成分・飲み合わせを店頭でご確認ください`);
}
if (!isNone(allergies)) {
warnings.push(`⚠️ アレルギー確認：「${allergies}」に対する過敏症成分が含まれていないかご確認ください`);
}


if (warnings.length === 0) {
warnings.push("✅ 入力内容からは特に追加の注意事項は見つかりませんでした。薬を使うかどうかは、店頭の薬剤師・登録販売者と一緒にご確認ください。");
}


// 受診の目安（ルールベース）
if (severity >= 8) referral.push("つらさが強い（8以上）ため、市販薬で様子を見る前に医療機関の受診も検討してください");
if (onset.includes('1週間以上')) referral.push("症状が1週間以上続いているため、医療機関の受診をおすすめします");
if (symptom.includes('やけど')) referral.push("やけどが広い・水ぶくれがある・顔や手足の関節・陰部の場合は受診してください");
if (symptom.includes('傷')) referral.push("傷が深い・汚れが取れない・出血が止まりにくい場合は受診してください");
if (symptom.includes('打撲') || symptom.includes('捻挫')) referral.push("強い腫れ・変形・体重をかけられない場合は骨折の可能性もあるため受診してください");
if (symptom.includes('発熱') && ageNum !== null && ageNum < 6) referral.push("小さな子どもの発熱は早めに医療機関へご相談ください");
if (symptom.includes('吐き気') || symptom.includes('下痢')) referral.push("水分がとれない・便に血が混じる・強い腹痛や高熱がある場合は受診してください");
if (symptom.includes('生理痛')) referral.push("いつもより極端に痛い・薬が効かない・毎回寝込むほどつらい場合は婦人科などへ相談してください");
if (symptom.includes('かゆみ') || symptom.includes('虫刺され')) referral.push("全身に広がる・顔や唇が腫れる・息苦しさがある場合はすぐに受診してください");


const categories = [];
const addCat = c => { if (!categories.includes(c)) categories.push(c); };
if (symptom.includes('頭痛') || symptom.includes('生理痛')) addCat("解熱鎮痛薬");
if (symptom.includes('発熱') || symptom.includes('のど')) { addCat("解熱鎮痛薬"); addCat("総合感冒薬"); }
if (symptom.includes('鼻水') || symptom.includes('くしゃみ')) addCat("鼻炎薬");
if (symptom.includes('腹痛') || symptom.includes('胃')) addCat("胃腸薬");
if (symptom.includes('吐き気') || symptom.includes('下痢')) addCat("整腸薬など（下痢止めは自己判断で使わず相談）");
if (symptom.includes('かゆみ') || symptom.includes('虫刺され')) addCat("かゆみ止めの外用薬");
if (symptom.includes('傷')) addCat("外用殺菌消毒薬 / 創傷被覆材");
if (symptom.includes('捻挫') || symptom.includes('打撲')) addCat("外用消炎鎮痛薬（湿布など）");
if (symptom.includes('やけど')) addCat("やけど用外用薬（まずは流水で冷やす）");
const category = categories.length ? categories.join('、') : "症状に応じたOTC医薬品";


return { category, warnings, referral };
}

function buildAdvicePayload() {

const destKey = state.destination.includes('薬剤師') ? 'pharmacist'
: state.destination.includes('保護者') ? 'parent'

const UNSAFE_ADVICE_PATTERN = /(診断|病名|疑いがあります|の可能性が高い|\d+\s*(mg|ｍｇ|ミリ|錠|カプセル|包)|服用して|飲んで|飲みましょう|処方|ロキソ|イブプロフェン|アセトアミノフェン|<|>|https?:)/i;


function sanitizeAdvice(text) {
if (typeof text !== 'string') return null;
const lines = text.replace(/[*#`_]/g, '').split(/\r?\n/).map(l => l.trim()).filter(Boolean)
.map(l => (l.startsWith('・') ? l : '・' + l.replace(/^[-•●]\s*/, '')).slice(0, 80))
.slice(0, 2);
const result = lines.join('\n');
if (!result || UNSAFE_ADVICE_PATTERN.test(result)) return null;
return result;
}


// ---- プロンプト（短く・必要な情報だけ） ----
const ADVICE_SYSTEM_PROMPT =
'相談カードに添える「伝え方のヒント」を書く。' +
'病名の推測・診断・薬の名前・用量・治療法・服薬の指示は書かない。' +
'日本語で「・」から始まる2行、各40字以内。前置き不要。';
const ADVICE_DESTINATIONS = { pharmacist: '薬剤師', parent: '保護者', school_nurse: '保健室の先生', teacher: '先生・スクールカウンセラー' };
const ADVICE_FEELINGS = ['😰 不安・緊張が強い', '😢 わけもなく悲しい・涙が出る', '🥱 疲れ切っている・力が出ない', '🌀 イライラする・モヤモヤする', '😶 何も感じない・無気力', '💬 誰かに聞いてほしい'];
const ADVICE_IMPACTS = ['💤 夜寝られない・朝起きられない', '🏫 学校に行きづらい・休みたい', '✏️ 勉強や作業に集中できない', '🍚 食欲がない・食べ過ぎる'];


// 用意した選択肢の値だけを残す（自由記入などが紛れ込んでも送信しない）
function pickAllowed(list, allowed, max) {
return Array.isArray(list) ? [...new Set(list.filter(v => allowed.includes(v)))].slice(0, max) : [];
}


function buildAdvicePrompt(p) {
const dest = ADVICE_DESTINATIONS[p.destination] || '保健室の先生';
const onset = ONSET_OPTIONS.includes(p.onset) ? p.onset : 'その他';
const age = ['15歳未満', '15歳以上', '不明'].includes(p.ageBand) ? p.ageBand : '不明';
const lines = [`宛先:dest`,`時期:{onset}`, `年齢:${age}`];
if (p.mode === 'mental') {
const feelings = pickAllowed(p.feelings, ADVICE_FEELINGS, 6).map(v => v.replace(/^\S+\s/, ''));
const impacts = pickAllowed(p.impacts, ADVICE_IMPACTS, 4).map(v => v.replace(/^\S+\s/, ''));
lines.unshift('種別:心の相談（やさしく安心できる口調で）');
lines.push(`気持ち:${feelings.join(',') || '言葉にしづらい'}`);
if (impacts.length) lines.push(`影響:${impacts.join(',')}`);
} else {
const symptoms = pickAllowed(p.symptoms, SYMPTOM_OPTIONS, 6);
const sev = Number(p.severity);
lines.unshift('種別:体調');
lines.push(`症状:${symptoms.join(',') || '自由記述のみ'}`);
if (Number.isInteger(sev) && sev >= 1 && sev <= 10) lines.push(`つらさ:${sev}/10`);
}
return lines.join('\n');
}


function hasGeminiKey() {
return typeof GEMINI_API_KEY === 'string' && GEMINI_API_KEY.trim().length >= 10;
}


let geminiThinkingSupported = true;


// Gemini を1回呼び出し、応答テキスト（思考部分を除く）を返す
async function requestGemini(prompt, signal) {
const send = withThinking => {
const generationConfig = { maxOutputTokens: GEMINI_MAX_OUTPUT_TOKENS, candidateCount: 1 };
// 思考トークンも出力上限を消費するため、短い回答では低くする
// （Gemini 3.8 Flash は low / medium / high のみ対応。'minimal' はエラーになる）
if (withThinking) generationConfig.thinkingConfig = { thinkingLevel: 'low' };
return fetch(GEMINI_ENDPOINT + encodeURIComponent(GEMINI_MODEL) + ':generateContent', {
method: 'POST',
// キーはURLではなくヘッダーで送る（履歴やログにURLが残ってもキーが含まれない）
headers: { 'Content-Type': 'application/json', 'x-goog-api-key': GEMINI_API_KEY.trim() },
body: JSON.stringify({
systemInstruction: { parts: [{ text: ADVICE_SYSTEM_PROMPT }] },
contents: [{ role: 'user', parts: [{ text: prompt }] }],
generationConfig
}),
signal,
credentials: 'omit',
referrerPolicy: 'no-referrer'
});
};


let res = await send(geminiThinkingSupported);
if (res.status === 400 && geminiThinkingSupported) {
// モデルが thinkingLevel に対応していない場合だけ、一度だけ設定なしで再試行
const errText = await res.text().catch(() => '');
if (!/thinking/i.test(errText)) return null;
geminiThinkingSupported = false;
res = await send(false);
}
if (!res.ok) {
console.warn('Gemini API error: HTTP', res.status); // 本文（キーや入力を含みうる）は出力しない
return null;
}
const data = await res.json().catch(() => null);
const candidate = data && Array.isArray(data.candidates) ? data.candidates[0] : null;
// 安全フィルターで止まった・上限で途中切れになった応答は使わない
if (!candidate || candidate.finishReason === 'SAFETY' || candidate.finishReason === 'MAX_TOKENS') return null;
const parts = candidate.content && Array.isArray(candidate.content.parts) ? candidate.content.parts : [];
return parts.filter(pt => !pt.thought && typeof pt.text === 'string').map(pt => pt.text).join('\n');
}


async function fetchGeminiAdvice(payload, token) {
// APIキー未設定ならAIを使わず定型文で作成する
if (!hasGeminiKey()) return null;


const cacheKey = JSON.stringify(payload);
if (adviceCache.has(cacheKey)) return adviceCache.get(cacheKey);


const controller = new AbortController();
currentAbort = controller;
const timer = setTimeout(() => controller.abort(), ADVICE_TIMEOUT_MS);
try {
const text = await requestGemini(buildAdvicePrompt(payload), controller.signal);
const advice = sanitizeAdvice(text);
if (advice && token === flowToken) adviceCache.set(cacheKey, advice);
return advice;
} catch (err) {
// 個人情報やキーを含めないよう、ログはエラー種別のみ
console.warn('AI advice unavailable:', err && err.name);
return null;
} finally {
clearTimeout(timer);
if (currentAbort === controller) currentAbort = null;
}
}

async function generatePDFCard() {
const token = ++flowToken;
setBusy(true);
setThemeStyle(isMentalMode() ? 'mental' : 'physical');
addBotMessage("ご入力内容を整理してカードを作成しています...");
updateStepIndicator("カード作成中…");
showLoadingControls();
// 連打（ダブルタップ）が同じ位置のキャンセルボタンに当たらないよう、少し待ってから有効化
setTimeout(() => {
const cancelBtn = document.getElementById('cancel-generation-btn');
if (cancelBtn && token === flowToken) cancelBtn.disabled = false;
}, 1000);


const slowTimer = setTimeout(() => {
const sub = document.getElementById('loading-sub');
if (sub && token === flowToken) sub.textContent = '応答に時間がかかっています。応答がない場合は定型の助言でカードを作成します。';
}, 5000);


let advice = null;
try {
advice = await fetchGeminiAdvice(buildAdvicePayload(), token);
} catch (e) {
advice = null;
} finally {
clearTimeout(slowTimer);
}


// 待っている間に「戻る」「やり直す」が押されていたら結果を捨てる
if (token !== flowToken) return;
setBusy(false);


state.geminiAdvice = advice || buildFallbackAdvice();
state.adviceSource = advice ? 'ai' : 'template';
addBotMessage("✅ カードができました！\n下のプレビューを確認して、画像・PDFで保存するか印刷してください。");
renderCard();
}

const EXPORT_WIDTH_PX = 560;


function setExportStatus(message, kind) {
const el = document.getElementById('export-status');
if (!el) return;
el.textContent = message || '';
el.className = 'text-[11px] font-bold text-center min-h-[1em] ' +
(kind === 'error' ? 'text-rose-700' : kind === 'ok' ? 'text-emerald-700' : 'text-slate-600');
}


function setExportButtonsDisabled(disabled) {
document.querySelectorAll('[data-export]').forEach(b => { b.disabled = disabled; });
if (backBtn) backBtn.disabled = disabled || isBusy;
}


// スクロール枠の外に、固定幅・高さ制限なしのカードの複製を作る（切れ・崩れ防止）
function createExportStage() {
const src = document.getElementById('pdf-card');
if (!src) return null;
const stage = document.createElement('div');
stage.setAttribute('aria-hidden', 'true');
stage.style.cssText = `position:absolute;left:-10000px;top:0;width:${EXPORT_WIDTH_PX}px;padding:16px;background:#ffffff;`;
const clone = src.cloneNode(true);
clone.removeAttribute('id');
clone.classList.remove('shadow-md');
clone.style.margin = '0';
stage.appendChild(clone);
document.body.appendChild(stage);
return stage;
}


async function waitForFonts() {
try {
if (document.fonts && document.fonts.ready) {
await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 3000))]);
}
} catch (e) { /* noop */ }
}


async function renderCardCanvas() {
if (typeof html2canvas !== 'function') throw new Error('html2canvas-missing');
await waitForFonts();
const stage = createExportStage();
if (!stage) throw new Error('card-missing');
try {
return await html2canvas(stage, {
scale: 2,
backgroundColor: '#ffffff',
useCORS: true,
logging: false,
windowWidth: Math.max(document.documentElement.clientWidth, EXPORT_WIDTH_PX + 40),
scrollX: 0,
scrollY: 0
});
} finally {
stage.remove();
}
}


function canvasToBlob(canvas, type, quality) {
return new Promise((resolve, reject) => {
canvas.toBlob(b => (b ? resolve(b) : reject(new Error('blob-failed'))), type, quality);
});
}


// スマホは共有メニュー（写真に保存など）、PCは通常のダウンロード
async function deliverFile(blob, filename, mime) {
const isTouch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
if (isTouch && navigator.canShare) {
try {
const file = new File([blob], filename, { type: mime });
if (navigator.canShare({ files: [file] })) {
await navigator.share({ files: [file], title: 'KOTOHANA相談カード' });
return 'shared';
}
} catch (err) {
if (err && err.name === 'AbortError') return 'cancelled';
// 共有できない場合は通常のダウンロードへ
}
}
const url = URL.createObjectURL(blob);
const link = document.createElement('a');
link.href = url;
link.download = filename;
link.rel = 'noopener';
document.body.appendChild(link);
link.click();
link.remove();
setTimeout(() => URL.revokeObjectURL(url), 10000);
return 'downloaded';
}


function exportErrorMessage(err) {
const code = err && err.message;
if (code === 'html2canvas-missing' || code === 'html2pdf-missing') {
return '保存に必要な部品を読み込めませんでした。通信環境を確認して再読み込みしてください。';
}
return '保存に失敗しました。もう一度お試しいただくか、「直接印刷」をご利用ください。';
}


window.downloadPNG = async function() {
if (isExporting || !document.getElementById('pdf-card')) return;
isExporting = true;

try {
const canvas = await renderCardCanvas();
const blob = await canvasToBlob(canvas, 'image/png');
const result = await deliverFile(blob, 'KOTOHANA相談カード.png', 'image/png');

setExportStatus(result === 'cancelled' ? '' : '✅ PNG画像を保存しました', 'ok');

console.warn('PNG export failed:', err && err.message);

isExporting = false;
setExportButtonsDisabled(false);
}
};


// 白紙1ページのA4 PDF（jsPDF）を用意する。
// html2pdf のバンドル版は jsPDF をグローバルに公開しないため、html2pdf が作るインスタンスを再利用する。
async function createBlankA4Pdf() {
if (window.jspdf && window.jspdf.jsPDF) return new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
if (typeof html2pdf !== 'function') throw new Error('html2pdf-missing');
const tiny = document.createElement('canvas');
tiny.width = 1; tiny.height = 1;
const pdf = await html2pdf().set({ margin: 0, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } }).from(tiny, 'canvas').toPdf().get('pdf');
pdf.addPage();
pdf.deletePage(1);
return pdf;
}


// A4に収まるよう縮小。長すぎる場合は複数ページに分割する
async function buildPdfBlob(canvas) {
const pdf = await createBlankA4Pdf();
const pageW = 210, pageH = 297, margin = 10;
const maxW = pageW - margin * 2, maxH = pageH - margin * 2;
const pxPerMm = canvas.width / maxW;
const fullHeightMm = canvas.height / pxPerMm;


if (fullHeightMm <= maxH) {
pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', margin, margin, maxW, fullHeightMm);
} else if (maxH / fullHeightMm >= 0.72) {
const scale = maxH / fullHeightMm;
const w = maxW * scale;
pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', (pageW - w) / 2, margin, w, maxH);
} else {
const sliceMaxPx = Math.floor(maxH * pxPerMm);
let y = 0;
let first = true;
while (y < canvas.height) {
const h = Math.min(sliceMaxPx, canvas.height - y);
const slice = document.createElement('canvas');
slice.width = canvas.width;
slice.height = h;
const ctx = slice.getContext('2d');
ctx.fillStyle = '#ffffff';
ctx.fillRect(0, 0, slice.width, slice.height);
ctx.drawImage(canvas, 0, y, canvas.width, h, 0, 0, canvas.width, h);
if (!first) pdf.addPage();
pdf.addImage(slice.toDataURL('image/jpeg', 0.95), 'JPEG', margin, margin, maxW, h / pxPerMm);
first = false;
y += h;
}
}
return pdf.output('blob');
}


window.downloadPDF = async function() {
if (isExporting || !document.getElementById('pdf-card')) return;
isExporting = true;
setExportButtonsDisabled(true);
setExportStatus('PDFを作成しています…');

const canvas = await renderCardCanvas();
const blob = await buildPdfBlob(canvas);
const result = await deliverFile(blob, 'KOTOHANA相談カード.pdf', 'application/pdf');
if (result !== 'cancelled') hasExported = true;
setExportStatus(result === 'cancelled' ? '' : '✅ PDFを保存しました', 'ok');
} catch (err) {
console.warn('PDF export failed:', err && err.message);

};

function calculateAge(birthdateStr) {
const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(birthdateStr || ''));
if (!m) return null;
const y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
const birthDate = new Date(y, mo - 1, d);
if (isNaN(birthDate.getTime()) || birthDate.getMonth() !== mo - 1 || birthDate.getDate() !== d) return null;
const today = new Date();
if (birthDate > today) return null;
let age = today.getFullYear() - y;
const diff = today.getMonth() - (mo - 1);
if (diff < 0 || (diff === 0 && today.getDate() < d)) age--;
return age;
}
